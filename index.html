<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel Bullet Roulette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="gameApp">
        <header id="topHeader">
            <h1 class="game-title">DUEL BULLET ROULETTE</h1>
        </header>

        <div id="game">
            <!-- Setup Configuration Screen -->
            <div id="config" class="neo-card">
                <div class="header-icon-wrap">
                    <img class="pistol pixel-float" src="assets/pistol.png" alt="Pistol">
                </div>
                <h2>GAME SETUP</h2>
                <p class="subtitle">CHAMBER CONFIGURATION</p>

                <!-- Bullet selection controls -->
                <div id="bulletSelection">
                    <div class="bullet-control safe-ctrl">
                        <span class="control-label">SAFE BULLETS</span>
                        <div class="control-row">
                            <button id="minusSafe" class="neo-btn btn-step">-</button>
                            <img src="assets/safe_bullet.png" alt="Safe Bullet" class="bullet-icon-img">
                            <span id="safeBulletCount" class="bullet-count-num">4</span>
                            <button id="plusSafe" class="neo-btn btn-step">+</button>
                        </div>
                    </div>

                    <div class="bullet-control danger-ctrl">
                        <span class="control-label">DANGER BULLETS</span>
                        <div class="control-row">
                            <button id="minusDanger" class="neo-btn btn-step">-</button>
                            <img src="assets/danger_bullet.png" alt="Danger Bullet" class="bullet-icon-img">
                            <span id="dangerBulletCount" class="bullet-count-num">6</span>
                            <button id="plusDanger" class="neo-btn btn-step">+</button>
                        </div>
                    </div>
                </div>

                <!-- Total bullets indicator -->
                <div id="totalBullets">
                    <h3>TOTAL CHAMBER PREVIEW</h3>
                    <div id="bulletIcons" class="bullet-icons-grid"></div>
                </div>

                <button id="startGame" class="neo-btn btn-primary start-btn">START DUEL</button>
            </div>

            <!-- Main Gameplay Screen -->
            <div id="mainGame" style="display: none;">
                <div id="gameHeader">
                    <div id="turnBadge" class="turn-badge">
                        <h2 id="turnInfo">PLAYER 1'S TURN</h2>
                    </div>
                </div>

                <!-- Battleground Area (ALWAYS SIDE-BY-SIDE) -->
                <div id="gameArea">
                    <!-- Player 1 Card -->
                    <div id="player1Area" class="neo-card player-card player1-theme">
                        <div class="player-name-badge">PLAYER 1</div>
                        <div class="sprite-wrapper">
                            <img id="player1" class="player idle" src="assets/player1_idle.png" alt="Player 1">
                        </div>
                        <div class="lives-wrapper">
                            <span class="lives-label">HP</span>
                            <div class="lives" id="player1Lives"></div>
                        </div>
                    </div>

                    <div class="versus-divider">
                        <img src="assets/pistol.png" alt="Pistol" class="vs-pistol">
                        <span class="vs-text">VS</span>
                    </div>

                    <!-- Player 2 Card -->
                    <div id="player2Area" class="neo-card player-card player2-theme">
                        <div class="player-name-badge">PLAYER 2</div>
                        <div class="sprite-wrapper">
                            <img id="player2" class="player idle" src="assets/player2_idle.png" alt="Player 2">
                        </div>
                        <div class="lives-wrapper">
                            <span class="lives-label">HP</span>
                            <div class="lives" id="player2Lives"></div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div id="actions" class="action-buttons-group">
                    <button id="shootSelf" class="neo-btn btn-action btn-shoot-self">
                        <span class="btn-title">[•] SHOOT SELF</span>
                    </button>
                    <button id="shootEnemy" class="neo-btn btn-action btn-shoot-enemy">
                        <span class="btn-title">[✕] SHOOT ENEMY</span>
                    </button>
                </div>

                <!-- Confirmation Modal Overlay -->
                <div id="confirm" class="neo-modal-overlay" style="display: none;">
                    <div class="modal-card neo-card">
                        <h3>PULL THE TRIGGER?</h3>
                        <p>CONFIRM ACTION</p>
                        <div class="modal-buttons">
                            <button id="yes" class="neo-btn btn-primary modal-btn-yes">YES, FIRE!</button>
                            <button id="no" class="neo-btn btn-secondary modal-btn-no">CANCEL</button>
                        </div>
                    </div>
                </div>

                <!-- Result Message Feed -->
                <div id="result" class="result-banner neo-card" style="display: none;"></div>

                <button id="reset" class="neo-btn btn-primary reset-btn" style="display: none;">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
